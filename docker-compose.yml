version: '3.8'

services:
  # 1. React Vite Frontend (Served via Nginx)
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: pool_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  # 2. Node.js Express Backend & Socket.io Server
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pool_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/8-pool
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=production-secret-jwt-key-eight-pool-ultra
      - CORS_ORIGIN=http://localhost:5173
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  # 3. Official MongoDB Database Container
  mongo:
    image: mongo:7.0
    container_name: pool_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  # 4. Official Redis Cache Container
  redis:
    image: redis:7-alpine
    container_name: pool_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local
